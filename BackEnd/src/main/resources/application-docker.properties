# Docker 环境配置
spring.application.name=campus-market

# 数据库配置
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:campus_market}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:campus}
spring.datasource.password=${DB_PASSWORD:campus123}

# Redis 配置
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT 配置
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key}
jwt.expiration-seconds=9000

# 邮件配置
spring.mail.host=${MAIL_HOST:smtp.163.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# 验证码配置
auth.code.ttl-seconds=300
auth.code.interval-seconds=60
auth.code.length=6
auth.code.subject=校园二手交易平台验证码

# 文件上传配置
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 阿里云 OSS 配置
aliyun.oss.endpoint=${OSS_ENDPOINT:}
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
aliyun.oss.bucket-name=${OSS_BUCKET_NAME:}
aliyun.oss.cdn-domain=${OSS_CDN_DOMAIN:}

# AI 配置
ai.dashscope.api-key=${AI_DASHSCOPE_API_KEY:}
ai.dashscope.model=${AI_DASHSCOPE_MODEL:qwen-vl-plus}
