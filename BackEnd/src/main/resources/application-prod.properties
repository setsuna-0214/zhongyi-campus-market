spring.application.name=campus-market

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:campus_market}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:9000}

spring.mail.host=${MAIL_HOST:smtp.163.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

auth.code.ttl-seconds=300
auth.code.interval-seconds=60
auth.code.length=6
auth.code.subject=校园二手交易平台验证码

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:30MB}
server.tomcat.max-http-post-size=${MAX_REQUEST_SIZE:30MB}
server.tomcat.max-swallow-size=${MAX_REQUEST_SIZE:30MB}

aliyun.oss.endpoint=${OSS_ENDPOINT:}
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
aliyun.oss.bucket-name=${OSS_BUCKET_NAME:}
aliyun.oss.cdn-domain=${OSS_CDN_DOMAIN:}

ai.dashscope.api-key=${AI_DASHSCOPE_API_KEY:}
ai.dashscope.model=${AI_DASHSCOPE_MODEL:qwen-vl-plus}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false

server.forward-headers-strategy=framework
logging.level.root=INFO
logging.level.org.example.campusmarket=INFO
